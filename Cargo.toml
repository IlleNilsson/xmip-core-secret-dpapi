# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-secret-dpapi"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-secret-dpapi"
description = "Windows DPAPI: a key-encryption key in a file sealed by CryptProtectData under the Service Identity. A xmip-core-secret technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). KekHolder, the wrapping and the errors live there;
# this crate only keeps the key.
secret = { package = "xmip-core-secret", git = "https://github.com/IlleNilsson/xmip-core-secret", branch = "main" }
# The key's bytes are overwritten when they are dropped.
zeroize = "1"

[target.'cfg(windows)'.dependencies]
# CryptProtectData and CryptUnprotectData behind a safe function each. A module
# crate forbids unsafe, and this is where the FFI lives instead of here
# (ADR-0050, amendment 2026-09-16: where unsafe may live is the owner's
# ruling). User scope only: machine scope would let any account on the machine
# open the key.
windows-dpapi = "0.2"

[lints.rust]
# forbid, not deny: a module has no business writing unsafe. The one exception
# in the estate is xmip-core-abi, which holds the extern "C" vtable over
# include/xmip_module.h and lowers this to deny with a reason at the call site.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
